services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parttime
      POSTGRES_PASSWORD: parttime_dev_pw
      POSTGRES_DB: parttime_jobs
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parttime -d parttime_jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
